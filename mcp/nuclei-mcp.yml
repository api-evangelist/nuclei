tools_count: 32
tools:
- name: approve_task
  description: 'Resolve the pending approval on a suspended task. Use this when get_task reports status
    `suspended` — typically a Thorough-mode (mode=plan) task waiting on plan review, or a planner waiting
    on ask_question answers.


    `decision=approve` executes the plan in the same task stream. `decision=decline` sends the plan back
    for revision using `feedback` (required) — it does NOT cancel the task, and the revised plan needs
    approval again. To stop a task outright use manage_task action=abort. When the task suspended on a
    clarifying question, pass the replies in `answers`.'
- name: create_issue
  description: 'File a new security finding. `title` is the only required field, but what you supply decides
    what Neo will store: a severity of high or critical is rejected without `remediation` (30+ characters),
    `cwe_ids` and `cvss_score`, and is silently recorded as `info` unless `impact` states a demonstrated
    effect or `evidence` proves one. Supply the proof with the finding rather than trying to raise its
    severity afterwards. Use `project_id` to file it into an engagement.'
- name: create_project
  description: 'Create a project to group related assessments. Returns a project_id you pass to create_task
    so every task in an engagement shares one scope. Use `settings_md` for standing instructions that
    apply to every task in the project (scope limits, rules of engagement, target constraints) — the agent
    reads it at the start of each project-scoped task, so it does not have to be repeated in every prompt.
    `type` is fixed at creation and cannot be changed: `shared` (default) uses the common workspace and
    is visible to your whole team; `dedicated` uses an isolated, private workspace only invited members
    can reach.'
- name: create_schedule
  description: Create a recurring or one-time schedule that runs a Neo assessment on a cadence. This is
    the MCP equivalent of POST /api/v1/schedules — do not pass schedule options to create_task. Recurring
    schedules need scan_frequency (and optionally start_time); one_time schedules need run_at. Call list_capabilities
    to discover valid agent_id, model, and project_id values. Returns the schedule id and next run time.
    With model auto, each run also picks a model for each subagent; subagent_models replaces the default
    list and subagent_reasoning_effort caps the effort. They are saved with the schedule and checked again
    on every run.
- name: create_task
  description: 'Start a new Neo AI security assessment (pentest, code review, recon, CVE triage, patch
    validation, and more) or continue an existing one. Pass the objective in `task`, e.g. "Run a security
    review of https://staging.example.com". Optional parameters mirror POST /api/v1/tasks: title, visibility,
    project, agent routing, sandbox, secrets, files, memory, and per-run credit/duration/step ceilings.


    Pick `mode` deliberately. `agent` (default) dispatches one agent immediately — good for a scoped,
    well-specified job. `plan` is Thorough mode: a planner gathers information and drafts a reviewable
    plan, the swarm executes it in parallel, and findings are re-verified before they surface — prefer
    it for broad or open-ended objectives such as a full-scope pentest. Saying "be thorough" in the prompt
    does NOT change the mode. `goal` plans once and then runs autonomously to completion. `chat` has limited
    tools.


    In `plan` mode the task suspends for your approval unless you pass auto_execute=true — call approve_task
    to release or revise the plan. Set ask_question=true to let the planner ask clarifying questions first
    (also answered via approve_task).


    Call list_capabilities to discover valid agent_id, model, and project_id values. Returns a task_id
    once the task is accepted and queued; Neo then works asynchronously. Next: call get_task to watch
    progress, then get_issues to read validated findings. Do not poll in a tight loop.


    With model auto (the default), Neo also picks a model for each subagent from a curated list your model
    source can use. Pass subagent_models to replace that list with models you choose, and subagent_reasoning_effort
    to cap the effort a subagent may use.'
- name: export_issues
  description: Export findings as JSON or CSV for a report or an external system, with the same filters
    as get_issues. Returns the exported document inline. Prefer get_issues for reading a handful of findings;
    this is for handing a whole set to something else. Read-only.
- name: get_agent
  description: Read one agent's details and whether you have it installed. `agent` accepts a directory
    UUID, a full Explore link (https://neo.projectdiscovery.io/explore/<uuid>) — which is how unlisted
    agents are reached — or the agent_id of an agent already installed on your account or a native Neo
    agent. Shared and installed agents also report when_to_use, required env vars, visibility, and author;
    Neo's built-in native agents have none of those, so those fields are absent rather than empty for
    them. Read-only.
- name: get_file
  description: Fetch an artifact a task produced (report, screenshot, scan output, etc.) by its file_key
    — get keys from get_task view=files. Small images (<=1MB) come back as inline image content, small
    text (<=100KB) as inline text. Anything larger or binary is returned as an auto-generated permanent,
    publicly accessible download link — note this creates a shareable link, so it is not a pure read.
- name: get_issue
  description: 'Read one finding in full by its UUID (get IDs from get_issues). `view=overview` (default)
    returns the description, impact, evidence, reproduction steps, remediation, CVSS/CVE/CWE, and every
    affected asset — everything get_issues leaves out. `view=timeline` returns the change history and
    comments: who changed severity or status, when, and why; `view=assets` lists every affected asset
    with its own remediation state and asset_id. Read this before re-classifying a finding with manage_issue.
    Read-only.'
- name: get_issue_stats
  description: Return finding counts broken down by severity, status, priority, type, and source, optionally
    scoped to one project or task. Use this for a posture summary instead of paging through get_issues
    and counting. Read-only.
- name: get_issues
  description: 'List validated security findings (issues). This is the primary way to read what Neo found:
    each issue is a confirmed vulnerability, misconfiguration, or exposure with severity, target, and
    remediation. Filter by task_id (findings from one assessment), project_id, severity, status, or a
    full-text search. Returns a summary line per finding — call get_issue for one finding''s description,
    evidence, and remediation. Read-only.'
- name: get_project
  description: Inspect one project. `view=overview` (default) returns its name, type, tags, settings_md,
    spending cap, and issue counts; `view=members` lists who has access. Use list_capabilities to discover
    project IDs. Read-only.
- name: get_pull_request
  description: 'Read one pull request in full: title, description, author, head and base branches, labels,
    draft and merge state, and Neo''s review summary with finding counts by severity. Read this before
    triggering a review — an open review, or a PR that is already merged, usually means there is nothing
    to run. Read-only.'
- name: get_repo_security_overview
  description: 'Neo''s standing security picture for a repository: its archetype, the top risk classes
    with severity and rationale, CVE and fix counts, and how much of the repository has been analysed.
    Use it to decide where review effort belongs; use list_pull_requests for what is in flight. Read-only.'
- name: get_task
  description: 'Inspect one task. Choose a `view`: `overview` (default — status, title, and the assistant''s
    latest response), `logs` (the agent + tool execution audit log), `report` (the narrative Insights
    summary; generated on demand if missing), `files` (artifacts the task produced), `health` (whether
    the live stream is still progressing), or `artifacts` (the completion artifact, when the task produced
    one). For validated vulnerabilities use get_issues instead. Read-only.'
- name: install_agent
  description: 'Install (fork) a shared agent into your account so create_task can route to it. `agent`
    must be a directory UUID or an Explore link — a slug is not enough, because the agent is not on your
    account yet. Returns the `agent_id` to pass to create_task''s agent_id. Calling it again for an agent
    you already have is not an error: it reports the existing agent_id. It does fail if a different agent
    of your own already occupies that agent_id, since routing a task there would run the wrong agent.'
- name: issue_config
  description: Read (`action=get`) or replace (`action=set`) the policy text that governs how Neo classifies
    findings — what counts as which severity, what is out of scope, house conventions. `project_id` targets
    that project's override instead of the account-wide policy. If findings are routinely coming out at
    the wrong severity, correcting this policy is the durable fix; re-classifying them one by one is not.
    `set` replaces the whole document, so read it first.
- name: list_capabilities
  description: 'Discover what you can use when starting a task: the specialized agents already installed
    on your account (agent_id), the selectable models (model), and your projects (project_id). Call this
    before create_task when you want to target a specific agent, model, or project. It does not list agents
    shared with you but not yet installed — an empty or unexpected result here does not mean the agent
    does not exist; use search_agents to browse the shared directory, or get_agent with an Explore link.
    Read-only.'
- name: list_files
  description: 'Browse the files in your workspace: task artifacts (reports, scan output, screenshots),
    and anything you have uploaded. Filter by `directory` (e.g. tasks/{task_id}), a filename `search`,
    or `types` (comma-separated extensions). Returns each file''s key, size, and MIME type — pass a key
    to get_file to read it. Read-only.'
- name: list_pull_requests
  description: List pull requests Neo can see, across every connected repository or within one `repo_id`.
    Each entry carries the PR number, title, author, branches, state, and — where Neo has already reviewed
    it — the finding counts by severity. Filter by `state` (open, closed, all), a `search` string, `has_issues`
    to show only PRs with findings, or `include_merged`. Read-only.
- name: list_repos
  description: 'List the GitHub repositories connected to Neo, with each one''s repo_id, whether automatic
    review is enabled, and its review statistics. Start here: every other GitHub tool takes `repo_id`,
    which is Neo''s own identifier and not the owner/name string. Filter with `search`. Read-only.'
- name: list_tasks
  description: List your assessments with optional filters (project_id, status, search, visibility, is_scheduled),
    optional team-shared tasks, and pagination. Returns task summaries (id, title, status, created time).
    Read-only.
- name: manage_file
  description: 'Perform an action on a workspace file. `action` is one of: `move` (requires `new_key`
    — also the way to rename a file), or `delete` (requires `confirm` set to true; pass `recursive` to
    remove a whole directory). Use `task_id` or `project_id` to act on a file in that sandbox — the same
    key can exist in more than one. Deletion is permanent and a task artifact cannot be regenerated without
    re-running the task.'
- name: manage_file_share
  description: Control the public download link for a workspace file. `action=get` creates one or returns
    the existing one, `action=revoke` removes it, and `action=regenerate` invalidates the current link
    and issues a new token. These links need no authentication and do not expire, so anyone holding one
    can read the file until it is revoked — get_file also mints one automatically for any file too large
    or too binary to return inline.
- name: manage_issue
  description: 'Change a finding''s classification or add a comment. `action` is one of:

    - `update` (requires `issue_id`) — set any of severity, status, confidence, priority, assignee, tags/tags_add/tags_remove.

    - `bulk_update` (requires `issue_ids`, max 1000) — apply the same change to several findings at once.

    - `comment` (requires `issue_id` and `comment`) — record a note without changing any field.

    - `delete` (requires `issue_id` and `confirm`) — remove one finding permanently.

    - `bulk_delete` (requires `issue_ids` and `confirm`) — remove several permanently.


    `update` also edits the finding''s body: title, description, impact, remediation, reproduction_steps,
    evidence, cvss_score, cwe_ids, cve_ids, references, target details, ticket links, and due_date. Deleting
    is irreversible and loses the finding''s history — prefer status `false_positive` or `duplicate`,
    which keep the record.


    Moving a finding to `false_positive` or `accepted_risk` retires it from the active set and requires
    `comment` explaining why; the reason is stored on every affected finding and shows up in get_issue
    view=timeline. Call get_issue first — re-classifying a finding whose evidence you have not read is
    how real vulnerabilities get closed by mistake.


    Neo will not store a severity above `info` for a finding with no demonstrated impact: it rewrites
    the severity, and drags status and confidence down with it, while still reporting success. `action=update`
    compares what it sent against what came back and tells you when that happened — read that notice rather
    than assuming the value you asked for was stored.'
- name: manage_issue_assets
  description: Add, update, or remove one of the assets a finding affects — the hosts, URLs, or resources
    it was observed on. `action=add` needs at least one locator (target, host, url, or ip_address); `update`
    and `remove` need `asset_id` from get_issue view=assets. Per-asset `status` (open, fixed, ignored)
    tracks partial remediation without closing the finding.
- name: manage_project
  description: 'Perform a lifecycle action on a project. `action` is one of: `rename` (requires `name`),
    `set_tags` (replaces the tag set with `tags`), `edit_settings` (edit settings_md — requires `text`,
    plus `settings_mode` and `old_text` for targeted replacements), `add_member` / `remove_member` (require
    `email`), `set_cap` (requires `spending_cap_credits`), `clear_cap`, or `delete`. `delete` is irreversible:
    it removes the project, its tasks, messages, and findings, and destroys its sandbox and volume — it
    requires `confirm_name` to exactly match the project''s current name. Most actions require project
    ownership.'
- name: manage_task
  description: 'Perform a lifecycle action on a task. `action` is one of: `rename` (requires `title`),
    `abort` (stop a running task), `fork` (branch a new task from a message — requires `message_id`),
    `resume` (continue a run that stopped on its own; a deliberately aborted run cannot be resumed), `abort_tools`
    (stop one in-flight tool call or subagent run without stopping the task — requires `tool_call_id`
    or `subagent_run_id`), `set_visibility` (requires `visibility`), or `delete` (permanently remove the
    task and its messages — irreversible). `delete` requires `confirm_name` to exactly match the task''s
    current title, or the task_id if it is untitled; read the task first. To stop a task without destroying
    it, use `abort`.'
- name: review_pull_request
  description: 'Start a Neo task against a pull request and return its task_id, which get_task then follows.
    `command` selects what it does:

    - `review` — security review of the diff (the default choice)

    - `full_review` — review the whole changed surface, not just the diff

    - `investigate` — dig into a specific question; pass it in `message`

    - `summary` — plain-language summary of the change

    - `fix` — **writes to GitHub**: pushes remediation commits to the PR''s branch

    - `create_issue` — **writes to GitHub**: opens an issue on the repository

    - `freeform` — run `message` as the instruction


    `fix` and `create_issue` change the repository and need `confirm` set to true. The others only produce
    a review. Runs are asynchronous and consume credits, so check get_pull_request for an existing review
    before starting another.'
- name: search_agents
  description: 'Browse or search the Explore directory of shareable Neo agents: public agents plus any
    team agents shared with you. Use it to find an agent you have not installed yet; use list_capabilities
    for the agents already on your account. Each result carries two identifiers — `uuid` (pass to get_agent
    / install_agent) and `agent_id` (pass to create_task once installed). Unlisted agents are deliberately
    not searchable; open them by UUID or Explore link with get_agent. Read-only.'
- name: send_task_input
  description: Send mid-run input to a task that is already working, without stopping it. The text is
    injected at the agent's next step, so use it to redirect scope, answer a question the run raised,
    or add a constraint — `abort` stops a run, this one changes its course. Only useful while a task is
    running; a finished task has no next step to inject into.
- name: upload_file
  description: Write a UTF-8 text file into your workspace and return its file_key, which create_task
    and create_schedule accept in `file_keys`. Use it to attach scope documents, target lists, rules of
    engagement, or configuration an assessment needs to read. `file_key` must start with workspace/. Text
    only — this tool cannot carry binary content; upload those through the web UI. An existing file at
    the same key is overwritten.
